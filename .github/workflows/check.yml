# Build and type check on every pull request and every push to main.
# Cloudflare Pages deploys main on its own; this is the gate before it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.json
